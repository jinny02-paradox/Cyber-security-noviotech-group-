
<!DOCTYPE html>
<html>
<head>
    <title>Phishing Awareness Lesson</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Phishing Awareness Lesson</h1>

    <div class="email-box">

        <h2>How to Identify Phishing Attacks?</h2>

        <p>1. Check the sender's email address.</p>

        <p>2. Avoid clicking suspicious links.</p>

        <p>3. Never share your password or OTP.</p>

        <p>4. Be careful with urgent messages.</p>

        <p>5. Verify website URLs before logging in.</p>

        <button onclick="window.location.href='index.html'">
            Back to Home
        </button>

        <button onclick="window.location.href='quiz.html'">
            Take Awareness Quiz
        </button>

    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000";

        async function trackAwarenessView() {

            const sessionId = localStorage.getItem("session_id");

            if (!sessionId) {
                console.warn("Session ID not found.");
                return;
            }

            try {
                const response = await fetch(API_URL + "/api/events", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        session_uuid: sessionId,
                        event_type: "AWARENESS_LESSON_VIEWED",
                        stage: "awareness",
                        target_element: "awareness_page"
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || "Event tracking failed");
                }

                console.log("Awareness lesson event saved:", data);

            } catch (error) {
                console.error("Awareness tracking error:", error);
            }
        }

        trackAwarenessView();
    </script>

</body>
</html>

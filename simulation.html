
<!DOCTYPE html>
<html>
<head>
    <title>Login Demonstration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-box">

        <h1>Account Login Demo</h1>

        <p>This is a simulated login page for cybersecurity awareness.</p>

        <input type="text" placeholder="Demo Username" disabled>

        <input type="password" placeholder="Password entry disabled" disabled>

        <button onclick="showAwareness()">
            Continue to Awareness Lesson
        </button>

        <p id="message"></p>

    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000";

        async function showAwareness() {
            const sessionId = localStorage.getItem("session_id");

            if (!sessionId) {
                alert("Session not found. Please restart the simulation.");
                return;
            }

            try {
                const response = await fetch(API_URL + "/api/events", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        session_uuid: sessionId,
                        event_type: "DEMO_CONTINUE_CLICKED",
                        stage: "simulation",
                        target_element: "continue_to_awareness",
                        metadata: {
                            action: "Participant continued to awareness lesson"
                        }
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || "Event could not be saved");
                }

                console.log("Event saved successfully:", data);

                window.location.href = "awareness.html";

            } catch (error) {
                console.error("Event tracking error:", error);
                alert("Could not save your progress. Please try again.");
            }
        }
    </script>

</body>
</html>

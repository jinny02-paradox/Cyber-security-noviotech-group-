
<!DOCTYPE html>
<html>
<head>
    <title>Phishing Awareness Quiz</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
    #resultBox {
        display: none;
        margin-top: 20px;
        padding: 15px;
        background: #170bca;
        border-radius: 8px;
    }
</style>
</head>
<body>

    <h1>Phishing Awareness Quiz</h1>

    <div class="email-box">

        <h2>Question 1</h2>
        <p>You receive an email asking for your OTP. What should you do?</p>

        <label>
            <input type="radio" name="q1" value="wrong">
            Share the OTP
        </label><br>

        <label>
            <input type="radio" name="q1" value="correct">
            Never share the OTP
        </label><br>

        <h2>Question 2</h2>
        <p>What should you do before clicking an unknown link?</p>

        <label>
            <input type="radio" name="q2" value="correct">
            Verify the URL
        </label><br>

        <label>
            <input type="radio" name="q2" value="wrong">
            Click immediately
        </label><br>

        <button id="submitButton" onclick="checkAnswers()">
            Submit Quiz
        </button>

        <div id="resultBox" style="display: none;">
    <h2 id="result"></h2>
    <p id="feedback"></p>
</div>

        <button onclick="window.location.href='index.html'">
            Back to Home
        </button>

    </div>

    <script>

        const API_URL = "http://127.0.0.1:5000";
        const startTime = Date.now();

        async function checkAnswers() {

            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');

            if (!q1 || !q2) {
    document.getElementById("resultBox").style.display = "block";
    document.getElementById("result").textContent =
        "Please answer both questions!";
    document.getElementById("feedback").textContent = "";
    return;
}

            const sessionId = localStorage.getItem("session_id");

            if (!sessionId) {
                alert("Session not found. Please restart the simulation.");
                return;
            }

            const timeTaken = Math.floor(
                (Date.now() - startTime) / 1000
            );

            const submitButton = document.getElementById("submitButton");
            submitButton.disabled = true;

            try {

                const response = await fetch(API_URL + "/api/quiz/submit", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        session_uuid: sessionId,
                        q1_answer: q1.value === "correct"
                            ? "never share the otp"
                            : "share the otp",

                        q2_answer: q2.value === "correct"
                            ? "verify the url"
                            : "click immediately",

                        time_taken_seconds: timeTaken
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || "Quiz submission failed");
                }
                localStorage.setItem("session_completed", "true");

document.getElementById("resultBox").style.display = "block";

document.getElementById("result").textContent =
    "Your Score: " + data.score + " / " +
    data.total_questions;

document.getElementById("feedback").textContent =
    data.feedback;

                console.log("Quiz submitted successfully:", data);

            } catch (error) {

                console.error("Quiz submission error:", error);

                document.getElementById("resultBox").style.display = "block";

document.getElementById("result").textContent =
    "Unable to submit quiz. Please try again.";

                submitButton.disabled = false;
            }
        }

    </script>

</body>
</html>
